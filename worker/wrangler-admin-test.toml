# Worker d'ADMINISTRATION de TEST (même code que l'espace apprenant, ROLE = "admin").
# Il partage les données de test (KV + D1) avec espace-apprenant-api-test.
name = "geoexpert-admin-test"
main = "worker.js"
compatibility_date = "2026-10-21"
workers_dev = true
preview_urls = false

[vars]
ROLE = "admin"
# Cloudflare Access est activé : connexion par e-mail + code obligatoire, vérifiée aussi par le Worker.
# (Ces deux valeurs ne sont pas secrètes.)
ACCESS_TEAM_DOMAIN = "https://gentle-haze-1336.cloudflareaccess.com"
ACCESS_AUD = "7cca0e57cec63c97f1010e26edd71deb744d66d029e2c344b4056941b29ee4a3"
ADMIN_EMAILS = "geographe07@gmail.com"
ALLOWED_ORIGINS = ""
LIBRARY_ID = "785941"
PLAYER_HOST = "iframe.mediadelivery.net"

[[kv_namespaces]]
binding = "ACCESS"
id = "955c726a9dd643eb84fed30281261636"

[[d1_databases]]
binding = "DB"
database_name = "geoexpert-test"
database_id = "3f7b44aa-686a-40d6-a442-ce09da27c3cf"

# Gros fichiers (Cloudflare R2, bucket PRIVÉ : pas de r2.dev ni de domaine public). Lien signé : secret DL_SECRET.
[[r2_buckets]]
binding = "FICHIERS"
bucket_name = "geoexpert-fichiers-test"
